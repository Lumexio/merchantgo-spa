name: Bug report
description: Report a reproducible MerchantGo marketing site defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include route, steps, and the affected link, plan, or content.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Navigation or routing, Pricing or product content, Responsive or accessibility, Link or download, GitHub Pages deployment, Other]
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, viewport, deployed/local URL, and sanitized console output.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal data, and tenant-sensitive values.
          required: true
